<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AgentDeck · AI CLI 配置中心</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f8cff'/%3E%3Ctext x='50' y='69' font-size='58' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E2%8C%98%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a21;
    --panel-2: #1d222b;
    --border: #2a3038;
    --text: #e6e9ef;
    --muted: #8b93a1;
    --accent: #4f8cff;
    --accent-2: #3a6fd8;
    --ok: #34c77b;
    --warn: #e6b450;
    --err: #e5604f;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 60px; }

  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: .5px; }
  header h1 .logo { color: var(--accent); }
  header .sub { color: var(--muted); font-size: 13px; }
  .catalog-line { color: var(--muted); font-size: 12px; margin-bottom: 18px; }
  .catalog-line code { color: #aab3c2; background: var(--panel-2); padding: 1px 6px; border-radius: 4px; }

  .banner {
    display: none; padding: 10px 14px; border-radius: var(--radius);
    background: rgba(229,96,79,.12); border: 1px solid rgba(229,96,79,.4); color: #f0a89f;
    margin-bottom: 18px; font-size: 13px;
  }
  .banner.show { display: block; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 12px;
  }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .card-head .name { font-size: 16px; font-weight: 600; }
  .card-head .paths { color: var(--muted); font-size: 11px; margin-top: 2px; word-break: break-all; }

  .current {
    background: var(--panel-2); border-radius: 8px; padding: 8px 12px;
    font-size: 12px; color: var(--muted);
  }
  .current b { color: #c6ccd6; font-weight: 500; }
  .current .nomatch { color: var(--warn); }

  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  select {
    width: 100%; padding: 8px 10px; border-radius: 8px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); font-size: 13px; outline: none; cursor: pointer;
  }
  select:focus { border-color: var(--accent); }

  .model-info {
    font-size: 12px; color: var(--muted); background: var(--panel-2);
    border-radius: 8px; padding: 8px 12px; display: flex; gap: 14px; flex-wrap: wrap;
  }
  .model-info b { color: #c6ccd6; font-weight: 600; }

  .result { font-size: 12px; min-height: 18px; margin-top: 2px; word-break: break-all; }
  .result.ok { color: var(--ok); }
  .result.err { color: var(--err); }

  .actions { margin-top: 22px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  button.primary {
    background: linear-gradient(180deg, var(--accent), var(--accent-2));
    color: #fff; border: none; border-radius: 10px;
    padding: 11px 26px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); }
  button.primary:disabled { opacity: .5; cursor: not-allowed; }
  .actions .hint { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="logo">⌘</span> AgentDeck</h1>
    <span class="sub">统一管理 Cline · Claude Code · OpenCode 的 Provider / Base URL / Model</span>
  </header>
  <div class="catalog-line" id="catalog-line">配置台账：<code>~/.config/agent-deck.yaml</code></div>
  <div class="banner" id="banner"></div>

  <div class="grid" id="cards"></div>

  <div class="actions">
    <button class="primary" id="save">保存配置</button>
  </div>
</div>

<script>
"use strict";

const state = { data: null };

/* ---------- 工具函数 ---------- */

const $ = (id) => document.getElementById(id);

function fmtTokens(n) {
  if (n == null) return "—";
  if (n >= 1e6) return (n % 1e6 === 0 ? n / 1e6 : (n / 1e6).toFixed(1)) + "M";
  return n.toLocaleString();
}
function maskKey(k) {
  if (!k) return "—";
  if (k.length <= 10) return k.slice(0, 3) + "***";
  return k.slice(0, 6) + "…" + k.slice(-4);
}
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
/* claude code 用原始地址；cline / opencode 由后端自动补 /v1，前端无需关心 */

/* 台账里存规范地址（可能不带 /v1），程序配置文件里可能已补 /v1，比较时归一化 */
function urlSame(a, b) {
  const norm = (u) => String(u ?? "").replace(/\/+$/, "").replace(/\/v1$/, "");
  return norm(a) === norm(b);
}

/* ---------- 数据加载 ---------- */

async function load() {
  $("save").disabled = true;
  try {
    const res = await fetch("/api/state");
    state.data = await res.json();
  } catch (e) {
    showBanner("无法连接本地服务：" + e.message);
    return;
  }
  render();
  $("save").disabled = !state.data.catalog;
}

function showBanner(msg) {
  const b = $("banner");
  b.textContent = msg;
  b.classList.add("show");
}

/* ---------- 渲染 ---------- */

function render() {
  const d = state.data;
  if (d.error) showBanner("⚠︎ " + d.error + " — 请修正 agent-deck.yaml 后刷新页面");
  if (d.catalogPath) $("catalog-line").innerHTML = "配置台账：<code>" + escapeHtml(d.catalogPath) + "</code>";

  const grid = $("cards");
  grid.innerHTML = "";

  for (const app of d.apps) {
    grid.appendChild(buildCard(app, d.catalog));
  }
}

function buildCard(app, catalog) {
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.app = app.id;

  const providerIds = Object.keys(catalog?.providers ?? {});
  const matchedPid = app.current?.provider ?? null;

  /* 头部：名称 + 路径 */
  const head = document.createElement("div");
  head.className = "card-head";
  const headLeft = document.createElement("div");
  headLeft.innerHTML =
    `<div class="name">${escapeHtml(app.name)}</div>` +
    `<div class="paths">${app.paths.map(escapeHtml).join("<br>")}</div>`;
  head.appendChild(headLeft);
  card.appendChild(head);

  /* 当前配置能与台账对上时，下拉框即当前值，无需重复展示；
     只有对不上（或没有配置文件）时才提示，避免误覆盖 */
  if (app.current && !matchedPid) {
    const notice = document.createElement("div");
    notice.className = "current";
    notice.innerHTML =
      `<span class="nomatch">当前配置（${escapeHtml(app.current.model ?? "?")} @ ${escapeHtml(app.current.baseURL ?? "?")}，key ${escapeHtml(maskKey(app.current.apiKey))}）未定义于 agent-deck.yaml，下拉框显示的不是当前值，保存将覆盖它</span>`;
    card.appendChild(notice);
  } else if (!app.current) {
    const notice = document.createElement("div");
    notice.className = "current";
    notice.innerHTML = `<span class="nomatch">未检测到配置文件（保存时将自动创建）</span>`;
    card.appendChild(notice);
  }

  if (!catalog || providerIds.length === 0) {
    const msg = document.createElement("div");
    msg.className = "result err";
    msg.textContent = "台账不可用，无法配置";
    card.appendChild(msg);
    return card;
  }

  /* 三个下拉框 */
  const selProvider = makeSelect("Provider");
  const selURL = makeSelect("Base URL");
  const selModel = makeSelect("Model");
  card.appendChild(selProvider.field);
  card.appendChild(selURL.field);
  card.appendChild(selModel.field);

  const info = document.createElement("div");
  info.className = "model-info";
  card.appendChild(info);

  const result = document.createElement("div");
  result.className = "result";
  card.appendChild(result);

  /* provider 选项 */
  for (const pid of providerIds) {
    selProvider.addOption(pid, pid);
  }

  /* model 列表与 provider 无关（台账里 models 与 providers 平级），只构建一次 */
  const modelEntries = Object.entries(catalog.models);
  selModel.setOptions(
    modelEntries.map(([mid, m]) => [
      mid,
      `${mid} · ctx ${fmtTokens(m.contextWindow)} · ¥${m.price.input}/¥${m.price.output}`,
    ]),
  );

  /* 重建 Base URL 列表；能对上 preferredUrl（忽略末尾斜杠 / /v1 差异）则选中它 */
  function fillUrls(preferredUrl) {
    const prov = catalog.providers[selProvider.value];
    selURL.setOptions(prov.baseUrls.map((u) => [u, u]));
    const idx = preferredUrl ? prov.baseUrls.findIndex((u) => urlSame(u, preferredUrl)) : -1;
    selURL.value = idx >= 0 ? prov.baseUrls[idx] : prov.baseUrls[0];
  }

  function updateInfo() {
    const m = catalog.models[selModel.value];
    if (!m) {
      info.innerHTML = "";
      return;
    }
    info.innerHTML =
      `<span>上下文 <b>${fmtTokens(m.contextWindow)}</b></span>` +
      (m.maxOutputTokens != null ? `<span>最大输出 <b>${fmtTokens(m.maxOutputTokens)}</b></span>` : "") +
      `<span>价格 <b>¥${m.price.input} 输入 / ¥${m.price.output} 输出</b> /百万 tokens</span>` +
      (m.price.cacheRead != null ? `<span>缓存读 <b>¥${m.price.cacheRead}</b></span>` : "");
  }

  /* 切 provider：只重建地址列表（沿用当前配置里属于该 provider 的地址），model 选择保持不变 */
  selProvider.el.addEventListener("change", () => {
    fillUrls(matchedPid === selProvider.value ? app.current?.baseURL : null);
    updateInfo();
  });
  /* 改 model / 地址：只刷新信息面板，不得重置其他下拉框 */
  selModel.el.addEventListener("change", updateInfo);
  selURL.el.addEventListener("change", updateInfo);

  /* 初始值：当前配置对得上台账就回显当前值，否则用第一个 */
  selProvider.value = matchedPid ?? providerIds[0];
  fillUrls(matchedPid === selProvider.value ? app.current?.baseURL : null);
  selModel.value =
    app.current?.model && catalog.models[app.current.model] ? app.current.model : modelEntries[0][0];
  updateInfo();

  card._collect = () => ({
    provider: selProvider.value,
    baseURL: selURL.value,
    model: selModel.value,
  });

  return card;
}

function makeSelect(labelText) {
  const field = document.createElement("div");
  field.className = "field";
  const label = document.createElement("label");
  label.textContent = labelText;
  const el = document.createElement("select");
  field.appendChild(label);
  field.appendChild(el);
  return {
    field,
    el,
    setOptions(entries) {
      el.innerHTML = "";
      for (const e of entries) {
        /* 兼容纯字符串（值即文本）与 [值, 文本] 二元组两种写法 */
        const [v, t] = Array.isArray(e) ? e : [e, e];
        const o = document.createElement("option");
        o.value = v;
        o.textContent = t;
        el.appendChild(o);
      }
    },
    addOption(v, t) {
      const o = document.createElement("option");
      o.value = v;
      o.textContent = t;
      el.appendChild(o);
    },
    get value() { return el.value; },
    set value(v) { el.value = v; },
  };
}

/* ---------- 保存 ---------- */

$("save").addEventListener("click", async () => {
  const btn = $("save");
  btn.disabled = true;
  btn.textContent = "保存中…";

  const apps = {};
  for (const card of document.querySelectorAll(".card")) {
    if (card._collect) apps[card.dataset.app] = card._collect();
  }

  try {
    const res = await fetch("/api/apply", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ apps }),
    });
    const data = await res.json();
    if (data.error) {
      showBanner("保存失败：" + data.error);
      return;
    }

    const anyError = Object.values(data.results ?? {}).some((r) => r && r.ok === false);

    for (const card of document.querySelectorAll(".card")) {
      const r = data.results?.[card.dataset.app];
      const el = card.querySelector(".result");
      if (!el) continue;
      if (!r) { el.className = "result"; el.textContent = ""; continue; }
      if (r.skipped) {
        el.className = "result";
        el.textContent = "＝ 无变化，未写入";
      } else if (r.ok) {
        el.className = "result ok";
        el.textContent = "✓ 已保存（" + r.changedFiles.join("、") + "）";
      } else {
        el.className = "result err";
        el.textContent = "✗ " + r.error;
      }
    }

    /* 保存成功（含全部无变化）：程序随后退出，尝试关闭页面；关不掉则显示告别页 */
    if (!anyError) {
      farewell();
    }
  } catch (e) {
    showBanner("保存失败：" + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "保存配置";
  }
});

function farewell() {
  document.title = "AgentDeck";
  document.body.innerHTML = `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1115;color:#e6e9ef;font:15px/1.8 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;">
      <div style="text-align:center;">
        <div style="font-size:34px;color:#34c77b;">✓</div>
        <div style="font-size:17px;font-weight:600;margin-top:10px;">配置已保存，AgentDeck 已退出</div>
        <div style="color:#8b93a1;margin-top:6px;font-size:13px;">此标签页可以关闭了</div>
      </div>
    </div>`;
  try {
    window.close();
  } catch {
    /* 浏览器不允许关闭非脚本打开的标签页时，停留在告别页 */
  }
}

load();
</script>
</body>
</html>
